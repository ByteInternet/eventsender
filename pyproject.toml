[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eventsender"
version = "1.4.0"
description = "RabbitMQ event sender"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Byte B.V.", email = "tech@byte.nl" }]
keywords = ["amqp", "rabbitmq", "events", "eventsender"]
requires-python = ">=3.9"
dependencies = [
    "pika>=1.3.2,<1.4",
    "opentelemetry-api>=1.16",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Utilities",
    "Topic :: Communications",
    "Topic :: Internet",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/ByteInternet/eventsender"

[dependency-groups]
dev = [
    "pytest",
    "opentelemetry-sdk",
]

[tool.setuptools]
packages = ["eventsender"]
